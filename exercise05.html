<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!-- Bài 1: Bảng sản phẩm -->
    <h2>My Store</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Item Photo</th>
                <th>Name</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQhxt6u8nGdLMuQyeSJaQ6yU0K00sDMweR_y8sKz2yeEw&s=10" alt="Oranges"width="120" style="border-radius: 12px;">
                <td>Oranges</td>
                <td>$1 ea.</td>
            </tr>
            <tr>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRkECUSCDkANNPqZT7Zop8GqQIk0S-rnj2hPgd_3srngg&s=10" alt="Bananas" width="120" style="border-radius: 12px;"></td>
                <td>Bananas</td>
                <td>$0.75/lb</td>
            </tr>
            <tr>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQWt1jKkI-TPBz618SwyMFZH3Ott5dx8VXiI0s0JGgwgQ&s=10" alt="Pomegranates" width="120" style="border-radius: 12px;"></td>
                <td>Pomegranates</td>
                <td>3 for $5</td>
            </tr>
            <tr>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRxKn9lA7FVOoLyPutjP0xp6dyZ5kbAVUIz5djqvTMXZQ&s=10" alt="Gummy Bears" width="120" style="border-radius: 12px;"></td>
                <td>Gummy Bears</td>
                <td>$6 per bag</td>
            </tr>
            <tr>
                <td><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR3cpAjpUhHKFjY7E0WwEFQsoqaqlU_dSyTAcKhCIk3pA&s=10" alt="Broccoli" width="120" style="border-radius: 12px;"></td>
                <td>Broccoli</td>
                <td>$3 a head</td>
            </tr>
        </tbody>
    </table>


    <!-- Bài 2: Form đặt phòng -->
    <h2>Booking Form</h2>
    <form>
        <label>Name:</label>
        <input type="text"><br><br>

        <label>Email:</label>
        <input type="email"><br><br>

        <label>Phone:</label>
        <input type="tel"><br><br>

        <label>Date:</label>
        <input type="date"><br><br>

        <label>Time:</label>
        <input type="time"><br><br>

        <label>Number of Guests:</label>
        <input type="number"><br><br>

        <input type="submit" value="Submit">
    </form>


    <!-- Bài 3: Form mua xe -->
    <h2>Car Purchase Form</h2>
    <form>
        <label>Name:</label>
        <input type="text"><br><br>

        <label>Email:</label>
        <input type="email"><br><br>

        <label>Phone:</label>
        <input type="tel"><br><br>

        <label>Choose a Car:</label>
        <select>
            <option>Model 1</option>
            <option>Model 2</option>
            <option>Model 3</option>
        </select><br><br>

        <label>Choose a Color:</label>
        <select>
            <option>Red</option>
            <option>Blue</option>
            <option>Black</option>
        </select><br><br>

        <label>Quantity:</label>
        <input type="number"><br><br>

        <label>Delivery Date:</label>
        <input type="date"><br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
